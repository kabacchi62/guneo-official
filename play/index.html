<script>
(()=>{
'use strict';

const canvas=document.getElementById('game'),
ctx=canvas.getContext('2d');

const panel=document.getElementById('panel'),
title=document.getElementById('title'),
desc=document.getElementById('desc'),
result=document.getElementById('result'),
modes=document.getElementById('modes'),
start=document.getElementById('start'),
scoreEl=document.getElementById('score'),
bestEl=document.getElementById('best'),
hint=document.getElementById('hint');

const custom=document.getElementById('custom'),
preview=document.getElementById('preview'),
pc=preview.getContext('2d');

/* ==========================
   LANGUAGE SYSTEM
========================== */

const translations={
ja:{
pageTitle:'#ぐねお | 無料で遊べるブラウザゲーム – #GUNEO',
gameTitle:'#ぐねお',
intro:'タップするたびにポンッと上昇！<br>壁に触れず、どこまで進める？',
start:'ゲームスタート',
retry:'もう一度挑戦',
gameOver:'ゲームオーバー',
easyOver:'連打のリズムをつかんでもう一度！',
hardOver:'頭だけでなく、体も壁に触れないように！',
customize:'カラーをカスタマイズ',
customTitle:'COLOR CUSTOMIZE',
headLabel:'頭の色',
bodyLabel:'体の色',
done:'決定して戻る',
official:'⌂ 公式サイトに戻る',
hint:'画面タップ / クリック / スペースキーでジャンプ',
share:'スコア画像をシェア',
save:'画像を保存',
shareOpened:'共有メニューを開きました',
shareFailed:'共有できませんでした。「画像を保存」をお試しください',
saved:'画像を保存しました',
savedHelp:'画像を保存しました。SNSの投稿画面から画像を添付してください',
imageFailed:'画像の作成に失敗しました',
saveFailed:'画像の保存に失敗しました',
blobFailed:'画像を作成できませんでした',
shareTitle:'#ぐねお スコア',
shareChallenge:'君はこの記録を超えられる？',
freeChallenge:'無料で挑戦！',
yourScore:'YOUR SCORE',
shareText:(m,s,n)=>'#ぐねお '+m+(m==='HARD'?' ×'+s:'')+
' で '+n+'m 達成！\n君はこの記録を超えられる？\n'
},
en:{
pageTitle:'#GUNEO v1.3',
gameTitle:'#GUNEO',
intro:'Tap to bounce upward!<br>Avoid the walls. How far can you go?',
start:'START GAME',
retry:'PLAY AGAIN',
gameOver:'GAME OVER',
easyOver:'Find your tapping rhythm and try again!',
hardOver:'Keep both your head and body away from the walls!',
customize:'CUSTOMIZE COLORS',
customTitle:'COLOR CUSTOMIZE',
headLabel:'Head Color',
bodyLabel:'Body Color',
done:'SAVE & RETURN',
official:'⌂ BACK TO OFFICIAL SITE',
hint:'Tap / Click / Press Space to jump',
share:'SHARE SCORE IMAGE',
save:'SAVE IMAGE',
shareOpened:'Share menu opened',
shareFailed:'Could not share. Please try Save Image.',
saved:'Image saved',
savedHelp:'Image downloaded. Attach it to your social media post.',
imageFailed:'Failed to create score image',
saveFailed:'Failed to save image',
blobFailed:'Could not create image',
shareTitle:'#GUNEO Score',
shareChallenge:'Can you beat my score?',
freeChallenge:'PLAY FREE!',
yourScore:'YOUR SCORE',
shareText:(m,s,n)=>'I scored '+n+'m in #GUNEO '+
m+(m==='HARD'?' ×'+s:'')+
'!\nCan you beat my score?\n'
}
};

function detectLanguage(){
try{
const saved=localStorage.getItem('guneo-language');
if(saved==='ja'||saved==='en')return saved;
}catch{}

const languages=navigator.languages&&navigator.languages.length?
navigator.languages:[navigator.language||'en'];

return String(languages[0]||'en').toLowerCase().startsWith('ja')?
'ja':'en';
}

const gameParams=new URLSearchParams(window.location.search);
const isEmbeddedDemo=window.parent!==window && gameParams.get('embed')==='1';
const requestedLanguage=gameParams.get('lang');
let language=(isEmbeddedDemo && (requestedLanguage==='ja'||requestedLanguage==='en'))
  ? requestedLanguage : detectLanguage();
if(isEmbeddedDemo){
  document.getElementById('languageSwitch').style.display='none';
  document.getElementById('hud').style.paddingTop='20px';
}

function t(key){
return translations[language][key];
}

function saveLanguage(){
try{
localStorage.setItem('guneo-language',language);
}catch{}
}

function updateLanguage(){
document.documentElement.lang=language;
document.title=t('pageTitle');

document.getElementById('langJP').classList.toggle('selected',language==='ja');
document.getElementById('langEN').classList.toggle('selected',language==='en');
document.getElementById('langJP').setAttribute('aria-pressed',String(language==='ja'));
document.getElementById('langEN').setAttribute('aria-pressed',String(language==='en'));

document.getElementById('customize').textContent=t('customize');
document.getElementById('customTitle').textContent=t('customTitle');
document.getElementById('headLabel').textContent=t('headLabel');
document.getElementById('bodyLabel').textContent=t('bodyLabel');
document.getElementById('done').textContent=t('done');
document.getElementById('officialSite').textContent=t('official');
document.getElementById('shareScore').textContent=t('share');
document.getElementById('saveScore').textContent=t('save');
hint.textContent=t('hint');

if(state==='over'){
title.textContent=t('gameOver');
desc.textContent=mode==='hard'?t('hardOver'):t('easyOver');
start.textContent=t('retry');
}else{
title.textContent=t('gameTitle');
desc.innerHTML=t('intro');
start.textContent=t('start');
}

const status=document.getElementById('shareStatus');
if(!status.hidden&&status.dataset.messageKey){
status.textContent=t(status.dataset.messageKey);
}

updateBest();
}


function setLanguage(next){
if(next!=='ja'&&next!=='en')return;
if(language===next)return;

const previousLanguage=language;

language=next;
saveLanguage();
updateLanguage();

// GA4：言語切り替えの記録
if(typeof gtag==='function'){
gtag('event','language_change',{
previous_language:previousLanguage,
game_language:language,
game_platform:'official_web'
});
}
}


document.getElementById('langJP').onclick=()=>setLanguage('ja');
document.getElementById('langEN').onclick=()=>setLanguage('en');

/* Return to the official site: close the host popup when embedded. */
document.getElementById('officialSite').addEventListener('click',event=>{
  if(!isEmbeddedDemo)return; // Standalone demo: follow the normal link.
  event.preventDefault();
  try{
    if(window.parent && typeof window.parent.closeGame==='function'){
      window.parent.closeGame();
      return;
    }
  }catch(error){ /* If embedding origin differs, navigate the top page. */ }
  window.top.location.href='https://guneo.net/';
});


/* ==========================
   COLOR CUSTOMIZE
========================== */

const palette=[
'#facc15','#63e68d','#42c9ff',
'#ff5964','#b58aff','#f5f7ff'
];

function savedColor(k,fallback){
try{
const c=localStorage.getItem(k);
return palette.includes(c)?c:fallback;
}catch{return fallback}
}

let headColor=savedColor('guneo-head','#facc15'),
bodyColor=savedColor('guneo-body','#63e68d');

function saveColors(){
try{
localStorage.setItem('guneo-head',headColor);
localStorage.setItem('guneo-body',bodyColor);
}catch{}
}

function drawPreview(){
preview.width=600;
preview.height=190;
pc.clearRect(0,0,600,190);
pc.strokeStyle=bodyColor;
pc.lineWidth=21;
pc.lineCap='round';
pc.beginPath();
pc.moveTo(30,145);
pc.bezierCurveTo(140,150,100,20,240,65);
pc.bezierCurveTo(350,115,380,145,515,83);
pc.stroke();
pc.fillStyle=headColor;
pc.beginPath();
pc.arc(515,83,24,0,Math.PI*2);
pc.fill();
}

function renderColors(){
for(const [id,value,set] of [
['headColors',headColor,c=>headColor=c],
['bodyColors',bodyColor,c=>bodyColor=c]
]){
const el=document.getElementById(id);
el.replaceChildren();
for(const c of palette){
const b=document.createElement('button');
b.className='swatch'+(value===c?' active':'');
b.style.background=c;
b.setAttribute('aria-label',c);

b.onclick=()=>{
set(c);
saveColors();

// GA4：カラー変更の記録
if(typeof gtag==='function'){
gtag('event','customize_color',{
color_part:id==='headColors'?'head':'body',
color_value:c,
game_language:language,
game_platform:'official_web'
});
}

renderColors();
};

el.appendChild(b);
}
}
drawPreview();
}

document.getElementById('customize').onclick=()=>{
panel.hidden=true;
custom.hidden=false;
renderColors();
};

document.getElementById('done').onclick=()=>{
custom.hidden=true;
panel.hidden=false;
};

/* ==========================
   GAME STATE
========================== */

let W=0,H=0,dpr=1,
mode='easy',
state='menu',
world=0,
score=0,
best=0,
headY=0,
vel=0,
last=0,
trail=[],
samples=[],
time=0,
flash=0;

const GAME_OVER_DELAY=0.5;
let gameOverTimer=0;

const SPEED=175,
STEP=8,
HEAD_X=.27,
BODY_LENGTH=360,
BODY_SPACING=3;

let hardSpeed=1;
const speedPick=document.getElementById('speedPick');

function key(){
return 'nyoronyoro-best-'+mode+
(mode==='hard'&&hardSpeed!==1?'-speed-'+hardSpeed:'');
}

function updateSpeedUI(){
speedPick.classList.toggle('visible',mode==='hard');
for(const b of speedPick.querySelectorAll('button')){
b.classList.toggle(
'selected',
Number(b.dataset.speed)===hardSpeed
);
}
}

for(const b of speedPick.querySelectorAll('button')){
b.addEventListener('click',()=>{
hardSpeed=Number(b.dataset.speed);
updateSpeedUI();
updateBest();
});
}

function readBest(){
try{
return Number(localStorage.getItem(key()))||0;
}catch{return 0}
}

function writeBest(n){
try{
localStorage.setItem(key(),String(n));
}catch{}
}

function updateBest(){
best=readBest();
bestEl.innerHTML='BEST '+mode.toUpperCase()+
(mode==='hard'?' '+hardSpeed+'×':'')+
'<br>'+best+' m';
}

function resize(){
W=innerWidth;
H=innerHeight;
dpr=Math.min(devicePixelRatio||1,2);
canvas.width=Math.round(W*dpr);
canvas.height=Math.round(H*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
if(state!=='playing'&&state!=='dying'){
headY=H*.5;
generate();
}
}

addEventListener('resize',resize);

function select(m){
mode=m;
document.getElementById('easy').classList.toggle('selected',m==='easy');
document.getElementById('hard').classList.toggle('selected',m==='hard');
updateSpeedUI();
updateBest();
generate();
}

document.getElementById('easy').onclick=()=>select('easy');
document.getElementById('hard').onclick=()=>select('hard');

function corridor(x){
const difficulty=Math.min(world/3500,1);
const gap=(mode==='easy'?
Math.min(H*.43,300):
Math.min(H*.37,250))*(1-.36*difficulty);
const wave=H*(.13+.035*difficulty);
const center=H*.52+
Math.sin(x/230)*wave+
Math.sin(x/101+1.2)*wave*.27;
return {
top:Math.max(28,center-gap/2),
bottom:Math.min(H-28,center+gap/2)
};
}

function generate(){
samples=[];
for(let x=0;x<=W+STEP;x+=STEP){
samples.push(corridor(world+x));
}
}

function begin(){
if(typeof gtag==='function'){
gtag('event','game_start',{
game_mode:mode,
game_speed:mode==='hard'?hardSpeed:1,
game_language:language
});
}

document.getElementById('shareScore').hidden=true;
document.getElementById('saveScore').hidden=true;
document.getElementById('shareStatus').hidden=true;
document.getElementById('shareStatus').dataset.messageKey='';

state='playing';
gameOverTimer=0;
world=0;
score=0;
vel=0;
time=0;
flash=0;

headY=(
corridor(W*HEAD_X).top+
corridor(W*HEAD_X).bottom
)/2;

trail=[];
for(let x=0;x>=-BODY_LENGTH-18;x-=BODY_SPACING){
trail.push({x,y:headY});
}

scoreEl.textContent='0 m';
updateBest();
panel.hidden=true;
hint.hidden=false;
generate();
last=performance.now();
}


function end(){
if(state!=='playing')return;

state='dying';
gameOverTimer=GAME_OVER_DELAY;
flash=1;
hint.hidden=true;

const n=Math.floor(score);
const isNewBest=n>best;

if(isNewBest){
best=n;
writeBest(n);
}
updateBest();

// GA4：ゲームオーバーの記録
if(typeof gtag==='function'){
gtag('event','game_over',{
game_mode:mode,
game_speed:mode==='hard'?hardSpeed:1,
game_language:language,
game_score:n,
play_time_seconds:Math.round(time),
new_best:isNewBest?1:0,
game_platform:'official_web'
});
}
}

function showGameOver(){
if(state!=='dying')return;

state='over';

document.getElementById('shareScore').hidden=false;
document.getElementById('saveScore').hidden=false;

const n=Math.floor(score);

title.textContent=t('gameOver');

desc.textContent=mode==='hard'?
t('hardOver'):t('easyOver');

result.hidden=false;
result.textContent=n+' m';
modes.style.display='flex';
start.textContent=t('retry');
panel.hidden=false;
hint.hidden=true;
}

start.onclick=begin;

function tap(){
if(state!=='playing')return;
vel=Math.max(vel-275,-410);
}

addEventListener('pointerdown',e=>{
if(e.target.closest('button')||e.target.closest('#panel'))return;
e.preventDefault();
tap();
},{passive:false});

addEventListener('keydown',e=>{
if(e.code==='Space'||e.code==='ArrowUp'){
e.preventDefault();
if(!e.repeat)tap();
}
});

/* ==========================
   BODY MOVEMENT
========================== */

function smoothBodyY(i){
if(i<=0)return headY;
const p=trail[i];
if(!p)return headY;

let sum=0,weight=0;
const radius=54;

for(let j=Math.max(0,i-30);
j<=Math.min(trail.length-1,i+30);j++){
const d=(trail[j].x-p.x)/radius;
const w=Math.exp(-2*d*d);
sum+=trail[j].y*w;
weight+=w;
}

const filtered=weight?sum/weight:p.y;
const distance=world-p.x;
const neck=Math.min(1,Math.max(0,distance/58));
const eased=neck*neck*(3-2*neck);

return headY*(1-eased)+filtered*eased;
}

function update(dt){
time+=dt;
world+=SPEED*(mode==='hard'?hardSpeed:1)*dt;
score=world/12;
scoreEl.textContent=Math.floor(score)+' m';

vel=Math.min(vel+(vel<0?350:220)*dt,260);
headY+=vel*dt;
generate();

const hx=W*HEAD_X;
const prev=trail[0];

if(prev){
const lastSampleX=prev.x;
const lastSampleY=prev.y;
const distance=world-lastSampleX;

if(distance>=BODY_SPACING){
const count=Math.floor(distance/BODY_SPACING);

for(let k=1;k<=count;k++){
const x=lastSampleX+k*BODY_SPACING;
const t=(x-lastSampleX)/distance;
trail.unshift({
x,
y:lastSampleY+(headY-lastSampleY)*t
});
}
}
}

while(
trail.length>2&&
trail[trail.length-1].x<world-BODY_LENGTH-18
){
trail.pop();
}

const r=mode==='easy'?9:8;
const c=corridor(world+hx);

if(time>.65&&(
headY-r<c.top||
headY+r>c.bottom
)){
end();
return;
}

if(mode==='hard'&&time>1.5){
for(let i=3;i<trail.length;i+=3){
const p=trail[i],
tx=hx+p.x-world;

if(tx<0)continue;

const wall=corridor(p.x+hx);
const radius=Math.max(
3,
8-(world-p.x)/BODY_LENGTH*5
);
const sy=smoothBodyY(i);

if(
sy-radius<wall.top||
sy+radius>wall.bottom
){
end();
return;
}
}
}
}

/* ==========================
   DRAW GAME
========================== */

function draw(){
ctx.clearRect(0,0,W,H);

const bg=ctx.createLinearGradient(0,0,0,H);
bg.addColorStop(0,'#0c1d35');
bg.addColorStop(1,'#11162c');
ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);

ctx.save();
ctx.globalAlpha=.18;
ctx.fillStyle='#6ee7f9';

for(let i=0;i<28;i++){
const x=(
(i*173-world*.13)%(W+120)+(W+120)
)%(W+120);
const y=(i*97)%Math.max(1,H);
ctx.fillRect(x,y,2,2);
}
ctx.restore();

generate();

ctx.beginPath();
ctx.moveTo(0,0);
for(let x=0;x<=W+STEP;x+=STEP){
ctx.lineTo(x,corridor(world+x).top);
}
ctx.lineTo(W,0);
ctx.closePath();
ctx.fillStyle='#253d50';
ctx.fill();

ctx.beginPath();
ctx.moveTo(0,H);
for(let x=0;x<=W+STEP;x+=STEP){
ctx.lineTo(x,corridor(world+x).bottom);
}
ctx.lineTo(W,H);
ctx.closePath();
ctx.fill();

for(const side of ['top','bottom']){
ctx.beginPath();

for(let x=0;x<=W+STEP;x+=STEP){
const y=corridor(world+x)[side];
if(x===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
}

ctx.strokeStyle=side==='top'?'#54c8bf':'#59d2c5';
ctx.lineWidth=4;
ctx.shadowColor='#38bdf8';
ctx.shadowBlur=10;
ctx.stroke();
ctx.shadowBlur=0;
}

const hx=W*HEAD_X;

if(mode==='hard'&&trail.length>1){
ctx.lineCap='round';
ctx.lineJoin='round';

for(let i=trail.length-1;i>=1;i--){
const p=trail[i],
q=trail[i-1],
progress=Math.min(
1,
(world-p.x)/BODY_LENGTH
);

ctx.beginPath();
ctx.moveTo(
hx+p.x-world,
smoothBodyY(i)
);
ctx.lineTo(
hx+q.x-world,
smoothBodyY(i-1)
);
ctx.strokeStyle=bodyColor;
ctx.lineWidth=5+12*(1-progress);
ctx.stroke();
}

ctx.beginPath();
ctx.moveTo(hx,smoothBodyY(0));
ctx.quadraticCurveTo(
hx-2,
(smoothBodyY(0)+headY)/2,
hx,
headY
);
ctx.strokeStyle=bodyColor;
ctx.lineWidth=16;
ctx.stroke();
}

ctx.beginPath();
ctx.arc(
hx,
headY,
mode==='easy'?9:11,
0,
Math.PI*2
);
ctx.fillStyle=headColor;
ctx.shadowColor='#fbbf24';
ctx.shadowBlur=19;
ctx.fill();
ctx.shadowBlur=0;

if(flash>0){
ctx.fillStyle='rgba(251,113,133,.13)';
ctx.fillRect(0,0,W,H);
flash*=.9;
}
}

/* ==========================
   SCORE IMAGE & SHARING
========================== */

const PLAY_URL='https://guneo.net/play/';
const shareScore=document.getElementById('shareScore');
const saveScore=document.getElementById('saveScore');
const shareStatus=document.getElementById('shareStatus');

function showShareStatus(messageKey){
shareStatus.dataset.messageKey=messageKey;
shareStatus.textContent=t(messageKey);
shareStatus.hidden=false;
}

function makeScoreCanvas(){
const c=document.createElement('canvas');
c.width=1080;
c.height=1350;

const g=c.getContext('2d');
const bg=g.createLinearGradient(0,0,0,1350);
bg.addColorStop(0,'#152b52');
bg.addColorStop(1,'#080f2b');

g.fillStyle=bg;
g.fillRect(0,0,1080,1350);

g.strokeStyle='#31547b';
g.lineWidth=4;
g.strokeRect(40,40,1000,1270);

g.textAlign='center';
g.fillStyle='#67e8f9';
g.font='bold 38px sans-serif';
g.fillText('ONE TAP ACTION',540,135);

g.fillStyle='#ffffff';
g.font='bold 108px sans-serif';
g.fillText(t('gameTitle'),540,285);

g.fillStyle='#67e8f9';
g.font='bold 38px sans-serif';
g.fillText('#GUNEO SCORE CHALLENGE',540,365);

g.fillStyle='#cbd5e1';
g.font='bold 40px sans-serif';
g.fillText(t('yourScore'),540,500);

const n=Math.floor(score);
g.fillStyle='#fbbf24';
g.font='bold 155px sans-serif';
g.fillText(n+' m',540,690);

g.fillStyle='#ffffff';
g.font='bold 56px sans-serif';
g.fillText(
mode.toUpperCase()+
(mode==='hard'?'  ×'+hardSpeed:''),
540,790
);

g.strokeStyle='#31547b';
g.beginPath();
g.moveTo(110,860);
g.lineTo(970,860);
g.stroke();

g.fillStyle='#ffffff';
g.font='bold 47px sans-serif';
g.fillText(t('shareChallenge'),540,960);

g.fillStyle='#67e8f9';
g.font='bold 44px sans-serif';
g.fillText(t('freeChallenge'),540,1045);

g.fillStyle='#ffffff';
g.font='bold 27px sans-serif';
g.fillText(PLAY_URL,540,1130);

g.fillStyle='#9eb5d2';
g.font='bold 31px sans-serif';
g.fillText('#ぐねお   #GUNEO',540,1220);

return c;
}

function scoreBlob(){
return new Promise((resolve,reject)=>{
makeScoreCanvas().toBlob(
b=>b?resolve(b):
reject(new Error(t('blobFailed'))),
'image/png'
);
});
}

function downloadBlob(blob){
const url=URL.createObjectURL(blob);
const a=document.createElement('a');

a.href=url;
a.download='guneo-score-'+Math.floor(score)+'m.png';

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),30000);
}


shareScore.onclick=async()=>{
try{
const blob=await scoreBlob();
const file=new File(
[blob],
'guneo-score.png',
{type:'image/png'}
);

const text=t('shareText')(
mode.toUpperCase(),
hardSpeed,
Math.floor(score)
)+PLAY_URL+'\n#GUNEO';

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({files:[file]})
){
try{
await navigator.share({
files:[file],
title:t('shareTitle'),
text
});
showShareStatus('shareOpened');

// GA4：スコア共有を記録
if(typeof gtag==='function'){
gtag('event','score_share',{
game_mode:mode,
game_speed:mode==='hard'?hardSpeed:1,
game_language:language,
game_score:Math.floor(score),
game_platform:'official_web'
});
}

}catch(e){
if(e.name!=='AbortError'){
showShareStatus('shareFailed');
}
}
}else{
downloadBlob(blob);
showShareStatus('savedHelp');

// GA4：共有非対応端末での画像保存を記録
if(typeof gtag==='function'){
gtag('event','score_download',{
game_mode:mode,
game_speed:mode==='hard'?hardSpeed:1,
game_language:language,
game_score:Math.floor(score),
game_platform:'official_web'
});
}
}
}catch(e){
showShareStatus('imageFailed');
}
};



saveScore.onclick=async()=>{
try{
downloadBlob(await scoreBlob());
showShareStatus('saved');

// GA4：スコア画像の保存を記録
if(typeof gtag==='function'){
gtag('event','score_download',{
game_mode:mode,
game_speed:mode==='hard'?hardSpeed:1,
game_language:language,
game_score:Math.floor(score),
game_platform:'official_web'
});
}

}catch(e){
showShareStatus('saveFailed');
}
};


/* ==========================
   GAME LOOP
========================== */

function frame(now){
let dt=Math.min((now-last)/1000||0,.034);
last=now;

if(state==='playing'){
update(dt);
}else if(state==='dying'){
gameOverTimer-=dt;
if(gameOverTimer<=0){
showGameOver();
}
}

draw();
requestAnimationFrame(frame);
}

resize();
updateSpeedUI();
updateLanguage();
requestAnimationFrame(frame);

})();
</script>
